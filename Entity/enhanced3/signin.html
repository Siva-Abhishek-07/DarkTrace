<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DarkTrace — Sign In</title><link rel="stylesheet" href="auth.css"></head>
<body><div class="auth-shell"><div class="auth-card"><div class="brand"><div class="logo">⌁</div><div><strong>DarkTrace</strong><span>Threat Intelligence</span></div></div><div class="eyebrow">SECURE SIGN IN</div><h1>Welcome back</h1><p class="intro">Sign in to access your DarkTrace investigation dashboard.</p>
<form id="form"><label>Username</label><div class="username-wrap"><input id="username" autocomplete="username" placeholder="yourname" required><span>@darktrace.in</span></div><small class="hint">The @darktrace.in suffix is added automatically.</small><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="primary" id="btn" type="submit">Sign in</button><div id="msg" class="message" role="alert"></div></form>
<div class="auth-links">New user? <a href="/signup">Create an account</a></div><div class="security-note">🔒 Secure password hashing · Duplicate usernames are blocked.</div></div></div>
<script>const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();$('btn').disabled=true;$('msg').textContent='Signing in…';$('msg').className='message';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');location.href=d.redirect||'/'}catch(err){$('msg').textContent=err.message;$('msg').className='message error'}finally{$('btn').disabled=false}};</script></body></html>
